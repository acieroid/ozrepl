[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozrepl"
version = "0.1.0"
description = "A terminal REPL for Mozart/Oz"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0,<4",
    "Pygments>=2.10,<3",
]

[project.optional-dependencies]
test = ["pexpect>=4.8,<5"]

[project.scripts]
ozrepl = "ozrepl.cli:main"

[tool.setuptools]
packages = ["ozrepl"]

[tool.setuptools.package-data]
ozrepl = ["Repl.oz"]
